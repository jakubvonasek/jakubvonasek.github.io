<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Kitten Cam — Live for Emi 🐱</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#180510" />
<style>
  :root {
    --accent: #ff4f9a;
    --accent2: #ff9ecb;
    --text: #fff0f6;
    --muted: #e0a8c4;
    --live: #ff3355;
    /* Safe-area insets so nothing hides under a phone notch or home bar. */
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #180510;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* The stage fills the viewport. Uses dvh where supported so mobile browser
     chrome collapsing doesn't leave a gap at the bottom. */
  .stage {
    position: fixed;
    inset: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  /* The video covers the stage, cropping rather than letterboxing. */
  .stage video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #180510;
  }
  /* Vignette top and bottom so overlaid text stays readable over any frame. */
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 22%),
      linear-gradient(0deg, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0) 42%);
  }

  /* ---- Top bar: back link, live badge, viewers, uptime ---- */
  .topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: calc(12px + var(--sat)) calc(14px + var(--sar)) 12px calc(14px + var(--sal));
  }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #fff;
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(6px);
    padding: 6px 11px;
    border-radius: 999px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .back:hover { color: var(--accent2); }
  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--live);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 5px 9px;
    border-radius: 5px;
    text-transform: uppercase;
    box-shadow: 0 2px 8px rgba(0,0,0,0.45);
  }
  .live-badge .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #fff;
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }
  .pill {
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 5px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .uptime { margin-left: auto; font-variant-numeric: tabular-nums; }

  /* ---- Title, lower-left, broadcast style ---- */
  .title {
    position: absolute;
    z-index: 3;
    left: calc(16px + var(--sal));
    bottom: calc(88px + var(--sab));
    max-width: 60%;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .title h1 {
    font-size: 22px;
    margin: 0 0 2px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.7);
  }
  .title p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
    text-shadow: 0 1px 6px rgba(0,0,0,0.8);
  }

  /* ---- Bottom control bar ---- */
  .controls {
    position: absolute;
    z-index: 4;
    left: calc(14px + var(--sal));
    right: calc(14px + var(--sar));
    bottom: calc(14px + var(--sab));
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .chip {
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.14);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    padding: 9px 14px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip:active { transform: scale(0.97); }
  .chip.on {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-color: transparent;
  }
  .chip.icon { padding: 9px 12px; }
  .spacer { margin-left: auto; }

  /* ---- Chat, overlaid bottom-right ---- */
  .chatwrap {
    position: absolute;
    z-index: 3;
    right: calc(14px + var(--sar));
    bottom: calc(70px + var(--sab));
    width: min(340px, calc(100vw - 28px));
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: opacity 0.3s ease;
  }
  .chat {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 40vh;
    overflow-y: auto;
    /* Fade the top so older lines dissolve instead of cutting off hard. */
    mask-image: linear-gradient(180deg, transparent 0, #000 34px);
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 34px);
    scrollbar-width: none;
  }
  .chat::-webkit-scrollbar { display: none; }
  .msg {
    align-self: flex-start;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    border-radius: 12px;
    padding: 7px 11px;
    font-size: 13px;
    line-height: 1.45;
    max-width: 100%;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    animation: slideIn 0.35s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  .msg .who { font-weight: 700; color: var(--accent2); margin-right: 5px; }
  .msg.mine { align-self: flex-end; background: rgba(255,79,154,0.32); }
  .msg.mine .who { color: #cdeaff; }
  .say { display: flex; gap: 6px; }
  .say input {
    flex: 1;
    min-width: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 999px;
    padding: 9px 14px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
  }
  .say input::placeholder { color: rgba(255,240,246,0.55); }
  .say input:focus { outline: none; border-color: var(--accent); }
  .say button {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border: none;
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    font-family: inherit;
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
  }
  .say button:active { transform: scale(0.97); }

  /* Idle: the furniture fades away so it is just kittens. Any move brings
     it back. Never hides while typing or when the veil is still up. */
  body.idle .title,
  body.idle .chatwrap,
  body.idle .controls,
  body.idle .topbar { opacity: 0; pointer-events: none; }
  .topbar, .controls { transition: opacity 0.3s ease; }

  /* ---- Tap-to-start veil ---- */
  .veil {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(24,5,16,0.6);
    backdrop-filter: blur(3px);
    cursor: pointer;
    text-align: center;
    padding: 20px;
  }
  .veil.hide { display: none; }
  .veil .play {
    width: 74px;
    height: 74px;
    border-radius: 50%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    box-shadow: 0 6px 28px rgba(255,79,154,0.5);
  }
  .veil span { color: var(--text); font-size: 14px; text-shadow: 0 1px 6px rgba(0,0,0,0.7); }

  /* Phones: chat sits above the bar, full width, and shorter. */
  @media (max-width: 560px) {
    .title { bottom: auto; top: calc(56px + var(--sat)); max-width: calc(100% - 32px); }
    .title h1 { font-size: 19px; }
    .chatwrap {
      left: calc(14px + var(--sal));
      width: auto;
      bottom: calc(66px + var(--sab));
    }
    .chat { max-height: 32vh; }
    .stream-note { display: none; }
  }
  /* Landscape phones are short: drop the title so chat and controls fit. */
  @media (max-height: 430px) {
    .title { display: none; }
    .chat { max-height: 30vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    .live-badge .dot, .msg { animation: none; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <video id="stream" playsinline loop muted preload="auto"
           poster="poster.jpg" src="cats.mp4"></video>

    <div class="topbar" id="topbar">
      <a class="back" href="/emi/">← back to the guide</a>
      <span class="live-badge"><span class="dot"></span>Live</span>
      <span class="pill" id="viewers">👀 2 watching</span>
      <span class="pill uptime" id="uptime">00:00:00</span>
    </div>

    <div class="title" id="title">
      <h1>🐱 Kitten Cam</h1>
      <p>Broadcasting non-stop, just for you. 💕</p>
    </div>

    <div class="chatwrap" id="chatwrap">
      <div class="chat" id="chat"></div>
      <div class="say">
        <input id="sayInput" type="text" maxlength="120"
               placeholder="Say something to the kittens..." />
        <button id="sayBtn">Send</button>
      </div>
    </div>

    <div class="controls">
      <button class="chip" id="soundBtn">🔇 Sound off</button>
      <button class="chip icon" id="fsBtn" title="Fullscreen">⛶</button>
    </div>

    <div class="veil" id="veil">
      <div class="play">▶</div>
      <span>Tap to join the stream 💕</span>
    </div>
  </div>

  <script>
    // ---- Player -----------------------------------------------------------
    // Autoplay is only permitted while muted, so the stream starts silent and
    // the veil's tap is what buys us the right to turn sound on.
    const video = document.getElementById('stream');
    const veil = document.getElementById('veil');
    const soundBtn = document.getElementById('soundBtn');
    const fsBtn = document.getElementById('fsBtn');
    const stage = document.getElementById('stage');

    video.play().catch(() => { /* poster stays up until the tap */ });

    function join() {
      veil.classList.add('hide');
      video.muted = false;
      video.play().catch(() => {});
      syncSoundBtn();
      kick();
    }
    veil.addEventListener('click', join);

    function syncSoundBtn() {
      const on = !video.muted && video.volume > 0;
      soundBtn.textContent = on ? '🔊 Sound on' : '🔇 Sound off';
      soundBtn.classList.toggle('on', on);
    }
    soundBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      if (!video.muted) video.play().catch(() => {});
      syncSoundBtn();
    });
    syncSoundBtn();

    // ---- Real fullscreen --------------------------------------------------
    // The page is already viewport-filling; this goes to true OS fullscreen.
    // iPhone Safari exposes no element fullscreen, so there we fall back to
    // the video's own native fullscreen and hide the button if neither exists.
    function fsElement() {
      return document.fullscreenElement || document.webkitFullscreenElement;
    }
    function canFullscreen() {
      return !!(stage.requestFullscreen || stage.webkitRequestFullscreen
                || video.webkitEnterFullscreen);
    }
    function toggleFullscreen() {
      if (fsElement()) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        return;
      }
      if (stage.requestFullscreen) stage.requestFullscreen().catch(() => {});
      else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
      else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
    }
    if (!canFullscreen()) fsBtn.style.display = 'none';
    fsBtn.addEventListener('click', toggleFullscreen);
    function syncFsBtn() {
      const on = !!fsElement();
      fsBtn.textContent = on ? '⛶' : '⛶';
      fsBtn.title = on ? 'Exit fullscreen' : 'Fullscreen';
      fsBtn.classList.toggle('on', on);
    }
    document.addEventListener('fullscreenchange', syncFsBtn);
    document.addEventListener('webkitfullscreenchange', syncFsBtn);

    // Double-tap / double-click the video toggles fullscreen, like any player.
    stage.addEventListener('dblclick', (e) => {
      if (e.target.closest('.controls, .chatwrap, .topbar')) return;
      toggleFullscreen();
    });
    // "f" toggles fullscreen, "m" mutes — but not while typing in the chat.
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'f') toggleFullscreen();
      if (e.key === 'm') soundBtn.click();
    });

    // ---- Idle fade --------------------------------------------------------
    // After a few still seconds the overlay clears so it is only kittens.
    let idleTimer;
    function kick() {
      document.body.classList.remove('idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        // Never fade out while the veil is up or the chat box has focus.
        // Looked up by id rather than closing over the `const` below, which
        // is not yet initialised when kick() first runs.
        if (veil.classList.contains('hide') &&
            document.activeElement !== document.getElementById('sayInput')) {
          document.body.classList.add('idle');
        }
      }, 4000);
    }
    ['mousemove', 'pointerdown', 'keydown', 'touchstart', 'wheel']
      .forEach(ev => document.addEventListener(ev, kick, { passive: true }));

    // ---- Uptime -----------------------------------------------------------
    // A real stream shows how long it has been up; this one counts from the
    // moment the page opened, which is the honest version of the same thing.
    const started = Date.now();
    const uptimeEl = document.getElementById('uptime');
    setInterval(() => {
      const s = Math.floor((Date.now() - started) / 1000);
      const pad = (n) => String(n).padStart(2, '0');
      uptimeEl.textContent =
        `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
    }, 1000);

    // ---- Viewer count -----------------------------------------------------
    // It only ever wobbles between 2 and 3: the joke is that the audience is
    // the two of them, plus the occasional cat walking over a keyboard.
    const viewersEl = document.getElementById('viewers');
    setInterval(() => {
      const n = Math.random() < 0.25 ? 3 : 2;
      viewersEl.textContent = `👀 ${n} watching`;
    }, 7000);

    // ---- Chat -------------------------------------------------------------
    const chat = document.getElementById('chat');
    const sayInput = document.getElementById('sayInput');
    const sayBtn = document.getElementById('sayBtn');

    // Typing or focusing the chat must keep the overlay awake.
    sayInput.addEventListener('focus', kick);
    sayInput.addEventListener('input', kick);

    const LINES = [
      ['Jakub', 'welcome to the stream 💕'],
      ['mrkvička 🐈', 'mrrrp'],
      ['Jakub', 'that one on the left is my favourite'],
      ['koťátko 🐱', 'meow meow meow'],
      ['Jakub', 'still thinking about you btw'],
      ['maple 🍁', 'purrrrrrr'],
      ['Jakub', 'no idea how they sleep that much'],
      ['koťátko 🐱', 'zzzzz'],
      ['Jakub', 'the stream never stops, just like me missing you'],
      ['mrkvička 🐈', 'knocked something off the table again'],
      ['Jakub', 'ťuťuťu'],
      ['maple 🍁', 'Canada approves 🇨🇦'],
      ['koťátko 🐱', 'wants snacks. always.'],
      ['Jakub', 'ok one more hour of watching cats then bed'],
      ['mrkvička 🐈', '🐾🐾🐾'],
      ['Jakub', 'miluju tě 💕'],
    ];

    let li = 0;
    function push(who, text, mine) {
      const el = document.createElement('div');
      el.className = 'msg' + (mine ? ' mine' : '');
      const w = document.createElement('span');
      w.className = 'who';
      w.textContent = who;
      el.appendChild(w);
      el.appendChild(document.createTextNode(text));
      chat.appendChild(el);
      // Keep the log short so it never grows without bound over a long watch.
      while (chat.children.length > 25) chat.removeChild(chat.firstChild);
      chat.scrollTop = chat.scrollHeight;
    }

    // Seed a few so the chat is never an empty box, then trickle.
    for (let i = 0; i < 3; i++) { const [w, t] = LINES[li++]; push(w, t); }
    setInterval(() => {
      const [w, t] = LINES[li++ % LINES.length];
      push(w, t);
    }, 6500);

    function send() {
      const text = sayInput.value.trim();
      if (!text) return;
      push('Emi 💗', text, true);
      sayInput.value = '';
      kick();
      // He is always watching this stream, so he always answers.
      setTimeout(() => {
        const replies = [
          'I saw that 💕', 'haha same', 'the cats agree',
          'miss you 🩵', 'ťuťuťu', 'noted 🐾',
        ];
        push('Jakub', replies[Math.floor(Math.random() * replies.length)]);
      }, 1200 + Math.random() * 1200);
    }
    sayBtn.addEventListener('click', send);
    sayInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

    kick();
  </script>
</body>
</html>
