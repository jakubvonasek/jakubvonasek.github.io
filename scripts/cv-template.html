<!DOCTYPE html>
<html lang="cs" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- cv/index.html is generated from content/cv.md + scripts/cv-template.html by `npm run cv:build` -->

  <title>Jakub Vonášek · CV</title>
  <meta name="description" content="AI vývojář a solo founder. MakeIt3D, AI asistenti pro zdravotní pojišťovnu, 3D měření osob." />
  <meta name="author" content="Jakub Vonášek" />

  <!-- Shared by direct link only: keep it out of search results -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Open Graph / link previews (SMS, iMessage, WhatsApp) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Jakub.dev" />
  <meta property="og:url" content="https://jakub-dev.com/cv/" />
  <meta property="og:title" content="Jakub Vonášek · CV" />
  <meta property="og:description" content="AI vývojář a solo founder. MakeIt3D, AI asistenti pro zdravotní pojišťovnu, 3D měření osob." />
  <meta property="og:image" content="https://jakub-dev.com/cv/og.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Jakub Vonášek · CV · Founder · AI &amp; Full-Stack Engineer" />
  <meta property="og:locale" content="cs_CZ" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Jakub Vonášek · CV" />
  <meta name="twitter:description" content="AI vývojář a solo founder. MakeIt3D, AI asistenti pro zdravotní pojišťovnu, 3D měření osob." />
  <meta name="twitter:image" content="https://jakub-dev.com/cv/og.png" />

  <!-- Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

  <!-- Theme Colors (light & dark) -->
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

  <style>
    /* Site palette: dark by default, light when the system asks for it */
    :root {
      --bg: #0a0a0a;
      --text: #ffffff;
      --body: #d4d4d4;
      --muted: #a3a3a3;
      --rule: #262626;
      --control: #6b6b6b;
      --accent: #4dabf7;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --text: #0a0a0a;
        --body: #262626;
        --muted: #5c5c5c;
        --rule: #e5e5e5;
        --control: #8a8a8a;
        --accent: #1971c2;
      }
    }

    /* Base */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--body);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      font-size: 1rem;
      line-height: 1.65;
      overflow-wrap: break-word;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px 72px;
    }
    @media (min-width: 640px) {
      body {
        font-size: 1.0625rem;
      }
      main {
        padding: 88px 32px 120px;
      }
    }

    a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--control);
      text-decoration-thickness: 1px;
      text-underline-offset: 0.2em;
      transition: color 0.2s ease, text-decoration-color 0.2s ease;
    }
    a:hover {
      color: var(--accent);
      text-decoration-color: currentColor;
    }
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 2px;
    }
    strong {
      color: var(--text);
      font-weight: 600;
    }

    /* Header: name, subtitle, contact line, download button */
    h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(2rem, 1.4rem + 2.6vw, 2.75rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.025em;
    }
    .subtitle {
      margin: 0.75rem 0 0;
      color: var(--muted);
      font-size: 1.125rem;
      font-weight: 500;
      line-height: 1.4;
    }
    .subtitle strong {
      color: inherit;
    }
    .contact {
      margin: 0.5rem 0 0;
      color: var(--muted);
      font-size: 0.9375rem;
      line-height: 1.9;
    }
    .contact a {
      padding-block: 0.35em; /* taller tap targets without changing the line */
    }
    .pdf-button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 44px;
      margin-top: 1.5rem;
      padding: 0.625rem 1rem;
      border: 1px solid var(--control);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.9375rem;
      font-weight: 500;
      line-height: 1.2;
      text-decoration: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }
    .pdf-button:hover {
      color: var(--text);
      border-color: var(--text);
      background-color: var(--rule);
    }
    .pdf-button:focus-visible {
      outline-offset: 3px;
      border-radius: 6px;
    }
    .pdf-button svg {
      flex: none;
    }

    /* Sections: an hr in the source becomes a hairline above the section */
    .cv-section {
      margin-top: 2.5rem;
    }
    .cv-section.divided {
      padding-top: 2.5rem;
      border-top: 1px solid var(--rule);
    }
    .cv-section > * + *,
    .entry > * + * {
      margin-top: 0.6rem;
    }
    h2 {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    p,
    ul {
      margin: 0;
    }

    /* Roles and projects */
    .entry + .entry {
      margin-top: 1.75rem;
    }
    h3 {
      margin: 0;
      color: var(--text);
      font-size: 1.0625rem;
      font-weight: 600;
      line-height: 1.4;
    }
    .entry > .meta {
      margin-top: 0.125rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    ul {
      padding-left: 1.25rem;
    }
    li + li {
      margin-top: 0.4rem;
    }
    li::marker {
      color: var(--muted);
    }
    .line {
      display: block;
    }
    .line + .line {
      margin-top: 0.4rem;
    }

    /* Print / PDF: A4, black on white, nothing interactive */
    @page {
      size: A4;
      margin: 15mm;
    }
    @media print {
      :root {
        --bg: #ffffff;
        --text: #000000;
        --body: #000000;
        --muted: #444444;
        --rule: #cccccc;
        --control: #000000;
        --accent: #000000;
      }
      *,
      *::before,
      *::after {
        background: transparent !important;
        box-shadow: none !important;
        text-shadow: none !important;
      }
      body {
        font-size: 10pt;
        line-height: 1.42;
      }
      main {
        max-width: none;
        padding: 0;
      }
      .pdf-button {
        display: none;
      }
      a {
        text-decoration: none;
      }
      h1 {
        font-size: 21pt;
      }
      .subtitle {
        margin-top: 4pt;
        font-size: 11.5pt;
      }
      .contact {
        margin-top: 2pt;
        font-size: 9.5pt;
        line-height: 1.5;
      }
      .cv-section {
        margin-top: 13pt;
      }
      .cv-section.divided {
        padding-top: 13pt;
      }
      .cv-section > * + *,
      .entry > * + * {
        margin-top: 4pt;
      }
      h2 {
        margin-bottom: 8pt;
        font-size: 8pt;
        break-after: avoid;
      }
      h3 {
        font-size: 10.5pt;
        break-after: avoid;
      }
      .entry + .entry {
        margin-top: 10pt;
      }
      .entry > .meta {
        margin-top: 0;
        font-size: 9pt;
      }
      li + li,
      .line + .line {
        margin-top: 2pt;
      }
      .cv-header,
      .entry {
        break-inside: avoid;
      }
      p,
      li {
        orphans: 3;
        widows: 3;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="cv-header">
<!-- cv:header -->
      <a class="pdf-button" href="/cv/Jakub_Vonasek_CV.pdf" download="Jakub_Vonasek_CV.pdf" type="application/pdf">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        Stáhnout PDF
      </a>
    </header>
<!-- cv:body -->
  </main>
</body>
</html>
